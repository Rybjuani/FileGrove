[package]
name = "filegrove"
version = "0.1.0"
description = "Smart, simple file organization for everyone"
authors = ["FileGrove Contributors"]
license = "Apache-2.0"
repository = "https://github.com/filegrove/filegrove"
default-run = "filegrove"
edition = "2021"
rust-version = "1.75"

[lib]
name = "filegrove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "filegrove"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2.0.0-beta", features = [] }

[dependencies]
tauri = { version = "2.0.0-beta", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0-beta"
tauri-plugin-dialog = "2.0.0-beta"
tauri-plugin-fs = "2.0.0-beta"
tauri-plugin-os = "2.0.0-beta"
tauri-plugin-process = "2.0.0-beta"
tauri-plugin-updater = "2.0.0-beta"
tauri-plugin-notification = "2.0.0-beta"
tauri-plugin-autostart = "2.0.0-beta"
tauri-plugin-log = "2.0.0-beta"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-cron-scheduler = "0.10"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }

# Filesystem
notify = "6"
notify-debouncer-full = "0.3"
walkdir = "2"
glob = "0.3"
fs_extra = "1"
kamadak-exif = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
parking_lot = "0.12"
dashmap = "5"

# Path utilities
directories = "5"

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
